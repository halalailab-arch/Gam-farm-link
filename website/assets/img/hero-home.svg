    <g transform="translate(1240,635)">
      <rect x="0" y="25" width="170" height="100" fill="#062A1E"/>
      <path d="M-12 28 L85 -20 L182 28 Z" fill="#083527"/>
      <rect x="22" y="48" width="28" height="24" rx="2" fill="#DBB84D" opacity="0.9"/>
      <rect x="71" y="48" width="28" height="46" rx="2" fill="#E9D08A" opacity="0.85"/>
      <rect x="120" y="48" width="28" height="24" rx="2" fill="#C9A227" opacity="0.8"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="758" width="1600" height="142" fill="url(#ground)"/>

  <!-- palms -->
  <g stroke="#03170F" fill="#03170F">
    <g transform="translate(330,758)">
      <path d="M0 0 C 6 -40 4 -80 -2 -108" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M-2 -108 C -34 -128 -62 -128 -84 -116 C -52 -122 -26 -116 -2 -104 Z"/>
      <path d="M-2 -108 C 28 -130 58 -132 82 -122 C 52 -124 24 -116 0 -104 Z"/>
      <path d="M-2 -108 C -20 -140 -42 -156 -64 -160 C -38 -152 -16 -134 0 -106 Z"/>
      <path d="M-2 -108 C 12 -142 32 -158 56 -164 C 32 -152 12 -134 0 -106 Z"/>
      <path d="M-2 -108 C -4 -142 -8 -160 -14 -172 C -6 -156 0 -134 2 -108 Z"/>
    </g>
    <g transform="translate(1495,758) scale(0.8,-0.8) scale(1,-1)">
      <path d="M0 0 C -6 -42 -4 -84 2 -112" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M2 -112 C -30 -132 -58 -132 -80 -120 C -48 -126 -22 -120 2 -108 Z"/>
      <path d="M2 -112 C 32 -134 62 -136 86 -126 C 56 -128 28 -120 4 -108 Z"/>
      <path d="M2 -112 C -16 -144 -38 -160 -60 -164 C -34 -156 -12 -138 4 -110 Z"/>
      <path d="M2 -112 C 16 -146 36 -162 60 -168 C 36 -156 16 -138 4 -110 Z"/>
    </g>
  </g>

  <!-- street lights (nod to solar street lighting in TAF estates) -->
  <g stroke="#0E4636" stroke-width="5" stroke-linecap="round">
    <path d="M700 758 L700 668 L724 668" fill="none"/>
    <path d="M1120 758 L1120 662 L1096 662" fill="none"/>
  </g>
  <circle cx="730" cy="668" r="7" fill="#F2DC9B"/>
  <circle cx="1090" cy="662" r="7" fill="#F2DC9B"/>
  <circle cx="730" cy="668" r="16" fill="#F2DC9B" opacity="0.22"/>
  <circle cx="1090" cy="662" r="16" fill="#F2DC9B" opacity="0.22"/>
</svg>
