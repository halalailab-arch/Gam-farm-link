<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- REPLACE: swap for a real hero photograph of a TAF development when available -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041F17"/>
      <stop offset="0.52" stop-color="#0A392C"/>
      <stop offset="0.78" stop-color="#155844"/>
      <stop offset="1" stop-color="#3E6B4A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2DC9B"/>
      <stop offset="0.55" stop-color="#DBB84D"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon-glow" cx="0.72" cy="0.68" r="0.55">
      <stop offset="0" stop-color="#DBB84D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#DBB84D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052519"/>
      <stop offset="1" stop-color="#03170F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#F8F5EE">
    <circle cx="140" cy="110" r="1.6" opacity="0.5"/><circle cx="320" cy="70" r="1.2" opacity="0.35"/>
    <circle cx="520" cy="150" r="1.5" opacity="0.45"/><circle cx="720" cy="60" r="1.2" opacity="0.3"/>
    <circle cx="905" cy="130" r="1.7" opacity="0.5"/><circle cx="1180" cy="80" r="1.3" opacity="0.4"/>
    <circle cx="1380" cy="150" r="1.6" opacity="0.45"/><circle cx="1490" cy="60" r="1.2" opacity="0.3"/>
    <circle cx="240" cy="220" r="1.2" opacity="0.3"/><circle cx="1060" cy="200" r="1.3" opacity="0.35"/>
  </g>

  <rect width="1600" height="900" fill="url(#horizon-glow)"/>
  <circle cx="1150" cy="600" r="130" fill="url(#sun)"/>

  <!-- far skyline -->
  <g fill="#0A3226">
    <rect x="0" y="590" width="90" height="120"/>
    <rect x="100" y="555" width="60" height="155"/>
    <rect x="170" y="600" width="80" height="110"/>
    <rect x="300" y="565" width="55" height="145"/>
    <rect x="365" y="600" width="90" height="110"/>
    <rect x="480" y="545" width="60" height="165"/>
    <rect x="560" y="585" width="75" height="125"/>
    <rect x="700" y="560" width="58" height="150"/>
    <rect x="775" y="598" width="85" height="112"/>
    <rect x="1250" y="575" width="65" height="135"/>
    <rect x="1330" y="600" width="85" height="110"/>
    <rect x="1440" y="560" width="60" height="150"/>
    <rect x="1510" y="595" width="90" height="115"/>
