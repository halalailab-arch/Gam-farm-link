  <!-- mid layer: modern estate homes -->
  <g>
    <!-- home 1 -->
    <g transform="translate(120,640)">
      <rect x="0" y="30" width="150" height="90" fill="#062A1E"/>
      <path d="M-10 34 L75 -14 L160 34 Z" fill="#083527"/>
      <rect x="18" y="52" width="26" height="22" rx="2" fill="#E9D08A" opacity="0.92"/>
      <rect x="62" y="52" width="26" height="22" rx="2" fill="#DBB84D" opacity="0.85"/>
      <rect x="106" y="52" width="26" height="42" rx="2" fill="#C9A227" opacity="0.8"/>
    </g>
    <!-- home 2 (two-storey) -->
    <g transform="translate(430,600)">
      <rect x="0" y="0" width="120" height="160" fill="#05241A"/>
      <rect x="120" y="60" width="95" height="100" fill="#062A1E"/>
      <rect x="16" y="18" width="24" height="30" rx="2" fill="#E9D08A" opacity="0.9"/>
      <rect x="56" y="18" width="24" height="30" rx="2" fill="#DBB84D" opacity="0.75"/>
      <rect x="16" y="76" width="24" height="30" rx="2" fill="#C9A227" opacity="0.85"/>
      <rect x="56" y="76" width="24" height="30" rx="2" fill="#E9D08A" opacity="0.6"/>
      <rect x="136" y="82" width="22" height="26" rx="2" fill="#DBB84D" opacity="0.85"/>
      <rect x="172" y="82" width="22" height="26" rx="2" fill="#E9D08A" opacity="0.7"/>
      <rect x="0" y="-8" width="120" height="10" fill="#0B3B2E"/>
