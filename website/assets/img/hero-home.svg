    <g transform="translate(880,470)">
      <rect x="0" y="0" width="130" height="290" fill="#05241A"/>
      <rect x="0" y="-10" width="130" height="12" fill="#0B3B2E"/>
      <g opacity="0.9">
        <rect x="14" y="18" width="20" height="16" fill="#E9D08A"/><rect x="55" y="18" width="20" height="16" fill="#DBB84D" opacity="0.6"/><rect x="96" y="18" width="20" height="16" fill="#C9A227"/>
        <rect x="14" y="52" width="20" height="16" fill="#DBB84D" opacity="0.7"/><rect x="55" y="52" width="20" height="16" fill="#E9D08A"/><rect x="96" y="52" width="20" height="16" fill="#DBB84D" opacity="0.5"/>
        <rect x="14" y="86" width="20" height="16" fill="#C9A227"/><rect x="55" y="86" width="20" height="16" fill="#DBB84D" opacity="0.6"/><rect x="96" y="86" width="20" height="16" fill="#E9D08A"/>
        <rect x="14" y="120" width="20" height="16" fill="#E9D08A" opacity="0.7"/><rect x="55" y="120" width="20" height="16" fill="#C9A227"/><rect x="96" y="120" width="20" height="16" fill="#DBB84D" opacity="0.6"/>
        <rect x="14" y="154" width="20" height="16" fill="#DBB84D"/><rect x="55" y="154" width="20" height="16" fill="#E9D08A" opacity="0.5"/><rect x="96" y="154" width="20" height="16" fill="#C9A227" opacity="0.8"/>
        <rect x="14" y="188" width="20" height="16" fill="#E9D08A" opacity="0.85"/><rect x="55" y="188" width="20" height="16" fill="#DBB84D"/><rect x="96" y="188" width="20" height="16" fill="#E9D08A" opacity="0.6"/>
      </g>
    </g>
